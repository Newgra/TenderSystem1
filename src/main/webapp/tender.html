<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Деталі тендеру</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f6f9; padding: 20px; }
        .panel { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; margin-top: 0; }
        .info-block { background: #ecf0f1; padding: 15px; border-radius: 5px; margin-bottom: 20px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }

        button { border: none; padding: 10px 15px; font-size: 14px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-back { background-color: #95a5a6; color: white; margin-bottom: 15px; }
        .btn-submit { background-color: #27ae60; color: white; width: 100%; padding: 12px; font-size: 16px;}
    </style>
</head>
<body>

<div class="panel">
    <button class="btn-back" onclick="window.location.href='index.html'">Назад до списку</button>

    <div class="info-block" id="tenderInfo">
        <h2 id="tName">Завантаження...</h2>
        <p id="tDesc"></p>
        <p><strong>Статус:</strong> <span id="tStatus" style="color: #27ae60;"></span></p>
        <p><strong>Замовник:</strong> <span id="tOwner">Завантаження...</span></p>
    </div>

    <div id="executorPanel" style="display: none; border-top: 2px solid #eee; padding-top: 20px;">
        <h3>Подати пропозицію</h3>
        <form id="proposalForm">
            <div class="form-group">
                <label>Ваша ціна (грн):</label>
                <input type="number" id="price" required min="1">
            </div>
            <div class="form-group">
                <label>Коментар (чому саме ви?):</label>
                <textarea id="proposalDesc" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Відправити заявку</button>
        </form>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('loggedUser'));
    if (!user) window.location.href = 'login.html';

    const urlParams = new URLSearchParams(window.location.search);
    const tenderId = urlParams.get('id');

    async function loadTenderDetails() {
        if (!tenderId) {
            document.getElementById('tName').innerText = "Помилка: Тендер не знайдено";
            return;
        }

        try {
            const response = await fetch('/api/tenders/' + tenderId);
            if (response.ok) {
                const tender = await response.json();

                document.getElementById('tName').innerText = `#${tender.id} - ${tender.name}`;
                document.getElementById('tDesc').innerText = tender.description;
                document.getElementById('tStatus').innerText = tender.status;
                document.getElementById('tOwner').innerText = tender.ownerName || `ID ${tender.ownerId}`;

                if (user.id !== tender.ownerId) {
                    if (tender.status === 'ACTIVE') {
                        document.getElementById('executorPanel').style.display = 'block';
                    } else {
                        document.getElementById('executorPanel').style.display = 'block';
                        document.getElementById('executorPanel').innerHTML = `
                        <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px;
                                    text-align: center; font-weight: bold; border: 1px solid #f5c6cb; margin-top: 20px;">
                            Прийом пропозицій завершено. Тендер закритий або вже має виконавця.
                        </div>
                    `;
                    }                }

            } else {
                document.getElementById('tName').innerText = "Тендер не існує або видалений";
            }
        } catch (error) {
            console.error(error);
        }
    }

    document.getElementById('proposalForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const currentStatus = document.getElementById('tStatus').innerText.trim();
        if (currentStatus !== 'ACTIVE') {
            alert("Помилка: Прийом пропозицій до цього тендеру вже завершено!");
            window.location.reload();
            return;
        }

        const proposal = {
            tenderId: parseInt(tenderId),
            executorId: user.id,
            price: parseFloat(document.getElementById('price').value),
            description: document.getElementById('proposalDesc').value
        };

        try {
            const response = await fetch('/api/proposals', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(proposal)
            });

            if (response.ok) {
                alert("Ваша заявка успішно відправлена!");
                window.location.href = 'index.html';
            } else {
                const errorResult = await response.json();
                alert(errorResult.error || "Помилка відправки.");
            }
        } catch (error) {
            console.error("Помилка зв'язку:", error);
            alert("Помилка з'єднання з сервером.");
        }
    });

    loadTenderDetails();
</script>
</body>
</html>
